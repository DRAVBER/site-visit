<svg xmlns="http://www.w3.org/2000/svg" width="800" height="616" viewBox="0 0 800 616">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111120"/>
      <stop offset="1" stop-color="#08080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="616" fill="url(#bg)"/>
  <rect width="800" height="616" fill="url(#glow)"/>
  <rect width="800" height="616" fill="url(#dots)"/>

  <!-- иконка терминала -->
  <rect x="356" y="161" width="88" height="88" rx="22"
        fill="#7c5cff" fill-opacity="0.08"
        stroke="#9d8bff" stroke-opacity="0.6" stroke-width="2.5"/>
  <path d="M378 192 L396 210 L378 228" fill="none" stroke="#c7bcff"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="406" y1="228" x2="424" y2="228" stroke="#c7bcff"
        stroke-width="4.5" stroke-linecap="round"/>

  <text x="400" y="352" text-anchor="middle"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="62" font-weight="600" fill="#ffffff">Script</text>

  <line x1="362" y1="392" x2="438" y2="392" stroke="#7c5cff"
        stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>